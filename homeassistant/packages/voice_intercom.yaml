# =============================================================================
# Voice PE Volume Triggered Intercom - Home Assistant side
#
# Install with the API (recommended, everything stays editable in the UI):
#     python tools/push_config.py --devices devices.yaml --dashboard
# or as a package: copy to /config/packages/voice_intercom.yaml and add
#     homeassistant:
#       packages: !include_dir_named packages
# to configuration.yaml. Do one or the other, not both.
#
# Behaviour: anything said to a device after the wake word, a single press of
# the centre button, or a shout (custom firmware) is announced word for word on
# every other Assist satellite and pushed to the phones listed in
# input_text.intercom_phones. The notification has a Reply button (typed text
# is announced on every device) and a "Mute shouts 30 min" button.
# Every transcript is written to the logbook; echoes are dropped (see below).
#
# Note: the catch-all sentence trigger "{message}" takes precedence over Home
# Assistant's built-in commands for ALL input to the Home Assistant
# conversation agent, from any pipeline, the Companion app or the web UI.
# On a server running this, Assist is an intercom and nothing else.
# =============================================================================

input_text:
  intercom_last_sender:
    name: Intercom last sender
    icon: mdi:account-voice
    max: 255
  intercom_last_message:
    name: Intercom last message
    icon: mdi:message-text
    max: 255
  intercom_last_from:
    # Display name of whoever sent the last message (room, person or phone).
    name: Intercom last from
    icon: mdi:account-voice
    max: 255
  intercom_admins:
    # Comma-separated user ids of Home Assistant administrators; only their
    # phones get the Mute button and only they can mute. Set by push_config.py.
    name: Intercom admins
    icon: mdi:shield-account
    max: 255
  intercom_blocked_words:
    # Comma-separated words replaced by **** in transcripts, pushes and the
    # last-message card (and said as "bleep"). Case-insensitive, whole words;
    # a trailing * also matches endings, e.g. "fuck*" covers "fucking".
    # push_config.py fills in a default list the first time.
    name: Intercom blocked words
    icon: mdi:comment-remove
    max: 255
  intercom_compose:
    # The text box on the Intercom dashboard; "Send" announces and clears it.
    name: Intercom message
    icon: mdi:message-draw
    max: 255
  # The last 10 messages sent, newest in intercom_history_1, each stored as
  # "<ISO time>|<from>|<message>" (message cut to fit 255 characters). Shown
  # on the Intercom dashboard. Kept across restarts.
  intercom_history_1:
    name: Intercom history 1
    icon: mdi:history
    max: 255
  intercom_history_2:
    name: Intercom history 2
    icon: mdi:history
    max: 255
  intercom_history_3:
    name: Intercom history 3
    icon: mdi:history
    max: 255
  intercom_history_4:
    name: Intercom history 4
    icon: mdi:history
    max: 255
  intercom_history_5:
    name: Intercom history 5
    icon: mdi:history
    max: 255
  intercom_history_6:
    name: Intercom history 6
    icon: mdi:history
    max: 255
  intercom_history_7:
    name: Intercom history 7
    icon: mdi:history
    max: 255
  intercom_history_8:
    name: Intercom history 8
    icon: mdi:history
    max: 255
  intercom_history_9:
    name: Intercom history 9
    icon: mdi:history
    max: 255
  intercom_history_10:
    name: Intercom history 10
    icon: mdi:history
    max: 255
  intercom_phones:
    # "all" (the default): push to every Companion app device, including ones
    # added later. Or a comma-separated list of notify services, e.g.
    # "mobile_app_my_phone, mobile_app_partner_phone". Set by push_config.py
    # from "phones" in devices.yaml.
    name: Intercom phones
    icon: mdi:cellphone-message
    max: 255

input_boolean:
  intercom_transcripts:
    # Never changes state. Transcripts are logbook entries against it, so the
    # dashboard's logbook card shows only transcripts.
    name: Intercom transcripts
    icon: mdi:text-box-outline
  intercom_push_to_phones:
    name: Intercom push to phones
    icon: mdi:cellphone-message

timer:
  intercom_shout_mute:
    name: Intercom shout mute
    icon: mdi:bullhorn-variant-outline
    duration: "00:30:00"
    restore: true

script:
  intercom_broadcast:
    alias: "Intercom: broadcast"
    icon: mdi:bullhorn
    description: >-
      Announce a message on Assist satellites and push it to the intercom
      phones. With no targets it goes to every available satellite except the
      source.
    mode: parallel
    max: 10
    fields:
      message:
        name: Message
        description: Text to speak.
        required: true
        selector:
          text:
      source:
        name: Source satellite
        description: assist_satellite entity that sent the message; skipped as a target.
        required: false
        selector:
          entity:
            domain: assist_satellite
      sender:
        name: Sender
        description: Name shown on the phone when the message did not come from a satellite.
        required: false
        selector:
          text:
      exclude_phone:
        name: Exclude phone
        description: Notify services (comma-separated, e.g. mobile_app_my_phone) that get no push, usually the sender's.
        required: false
        selector:
          text:
      targets:
        name: Targets
        description: Optional. Leave empty for every satellite except the source.
        required: false
        selector:
          entity:
            domain: assist_satellite
            multiple: true
    sequence:
      - action: script.intercom_censor
        data:
          text: "{{ message }}"
        response_variable: censored
      - variables:
          message: "{{ censored.text }}"
          spoken: "{{ censored.spoken }}"
          source_id: "{{ source | default('', true) }}"
          explicit_targets: >-
            {% set t = targets | default([], true) %}
            {{ [t] if t is string else t }}
          all_satellites: >-
            {{ states.assist_satellite
               | rejectattr('state', 'in', ['unavailable', 'unknown'])
               | map(attribute='entity_id') | list }}
          target_list: >-
            {% set base = explicit_targets if explicit_targets | count > 0 else all_satellites %}
            {{ base | reject('eq', source_id) | list }}
          from_name: >-
            {% if source_id %}{{ area_name(source_id) or state_attr(source_id, 'friendly_name') }}
            {%- else %}{{ sender | default('Intercom', true) }}{% endif %}
          admins: "{{ states('input_text.intercom_admins').split(',') | map('trim') | list }}"
          # "all" (or empty): every Companion app device, found through its
          # device tracker, whose object id matches its notify service.
          # Otherwise the comma-separated list in input_text.intercom_phones.
          phones: >-
            {% set configured = states('input_text.intercom_phones') | trim %}
            {% if configured | lower in ['', 'all', 'unknown', 'unavailable'] %}
              {% set base = integration_entities('mobile_app') | select('search', '^device_tracker[.]')
                            | map('replace', 'device_tracker.', 'mobile_app_') | list %}
            {% else %}
              {% set base = configured.split(',') | map('trim') | reject('eq', '') | list %}
            {% endif %}
            {% set skip = (exclude_phone | default('', true)).split(',') | map('trim') | list %}
            {{ base | reject('in', skip) | list }}
      - action: input_text.set_value
        target:
          entity_id: input_text.intercom_last_sender
        data:
          value: "{{ source_id }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.intercom_last_message
        data:
          value: "{{ message[:255] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.intercom_last_from
        data:
          value: "{{ from_name[:255] }}"
      # Shift the 10-message history down by one and put this one on top.
      - variables:
          history: >-
            {% set entry = now().isoformat(timespec='seconds') ~ '|' ~ (from_name | replace('|', '/'))
                           ~ '|' ~ (message | trim | replace('|', '/')) %}
            {% set older = namespace(items=[]) %}
            {% for i in range(1, 10) %}
              {% set older.items = older.items + [states('input_text.intercom_history_' ~ i)] %}
            {% endfor %}
            {{ ([entry[:255]] + older.items)[:10] }}
      - repeat:
          for_each: "{{ history }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: "input_text.intercom_history_{{ repeat.index }}"
              data:
                value: "{{ repeat.item if repeat.item not in ['unknown', 'unavailable'] else '' }}"
      # Push first: it is quick, while announce waits for playback to finish.
      - if:
          - condition: state
            entity_id: input_boolean.intercom_push_to_phones
            state: "on"
          - condition: template
            value_template: "{{ phones | count > 0 }}"
        then:
          - repeat:
              for_each: "{{ phones }}"
              sequence:
                - variables:
                    # A phone belongs to an administrator when an admin's person
                    # entry lists its device tracker.
                    owner_is_admin: >-
                      {% set tracker = 'device_tracker.' ~ (repeat.item | replace('mobile_app_', '')) %}
                      {{ states.person | selectattr('attributes.user_id', 'in', admins)
                         | selectattr('attributes.device_trackers', 'contains', tracker) | list | count > 0 }}
                    phone_actions: >-
                      {% set reply = {'action': 'INTERCOM_REPLY', 'title': 'Reply', 'behavior': 'textInput',
                                      'textInputButtonTitle': 'Send', 'textInputPlaceholder': 'Message for the house'} %}
                      {% set mute = {'action': 'INTERCOM_MUTE_SHOUT', 'title': 'Mute shouts 30 min'} %}
                      {{ [reply, mute] if owner_is_admin else [reply] }}
                - action: "notify.{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "Intercom · {{ from_name }}"
                    message: "{{ message | trim }}"
                    data:
                      group: intercom             # iOS: one thread
                      channel: Intercom           # Android: own notification channel
                      url: /voice-intercom        # iOS: tap opens the dashboard
                      clickAction: /voice-intercom  # Android: same
                      intercom_phone: "{{ repeat.item }}"  # Android returns data fields
                      action_data:                # iOS returns action_data
                        phone: "{{ repeat.item }}"
                      actions: "{{ phone_actions }}"
      - if:
          - condition: template
            value_template: "{{ target_list | count > 0 }}"
        then:
          - action: assist_satellite.announce
            continue_on_error: true
            target:
              entity_id: "{{ target_list }}"
            data:
              message: "{{ spoken | trim }}"
              preannounce: false

  intercom_censor:
    alias: "Intercom: censor text"
    icon: mdi:comment-remove
    description: >-
      Returns {text, spoken}: the text with every word in
      input_text.intercom_blocked_words replaced by ****, and the same with
      "bleep" for text-to-speech.
    mode: parallel
    max: 20
    fields:
      text:
        name: Text
        required: true
        selector:
          text:
    sequence:
      - variables:
          result: >-
            {% set words = states('input_text.intercom_blocked_words').lower().split(',') | map('trim')
                           | reject('in', ['', 'unknown', 'unavailable']) | list %}
            {% set ns = namespace(parts=[]) %}
            {% for w in words %}
              {% set stem = w | regex_replace('[^a-z]', '') %}
              {% if stem %}{% set ns.parts = ns.parts + [stem ~ ('[a-z]*' if w.endswith('*') else '')] %}{% endif %}
            {% endfor %}
            {% set clean = (text | string | regex_replace('\\b(' ~ ns.parts | join('|') ~ ')\\b', '****', ignorecase=True))
                           if ns.parts else text | string %}
            {{ {'text': clean, 'spoken': clean | replace('****', 'bleep')} }}
      - stop: Censored
        response_variable: result

  intercom_send_typed:
    alias: "Intercom: send typed message"
    icon: mdi:send
    description: >-
      Announce the text in input_text.intercom_compose on every device, push it
      to the phones of everyone except the person who pressed Send, and clear
      the box. Wired to the Send button on the Intercom dashboard.
    mode: queued
    fields:
      user_id:
        name: User id
        description: Who typed the message. Defaults to the user who ran the script.
        required: false
        selector:
          text:
    sequence:
      # On a phone, tapping Send also commits the text box; give that a moment.
      - wait_template: "{{ states('input_text.intercom_compose') | trim | length > 0 }}"
        timeout: "00:00:02"
        continue_on_timeout: true
      - variables:
          text: "{{ states('input_text.intercom_compose') | trim }}"
          person: >-
            {{ states.person | selectattr('attributes.user_id', 'eq', user_id | default(context.user_id, true))
               | map(attribute='entity_id') | first | default('') }}
          sender: "{{ state_attr(person, 'friendly_name') if person else 'Dashboard' }}"
          own_phones: >-
            {{ (state_attr(person, 'device_trackers') or []) | map('replace', 'device_tracker.', 'mobile_app_')
               | join(',') if person else '' }}
      - condition: template
        value_template: "{{ text not in ['', 'unknown', 'unavailable'] }}"
      - action: script.intercom_censor
        data:
          text: "{{ text }}"
        response_variable: censored
      - action: logbook.log
        data:
          name: "{{ sender }}"
          entity_id: input_boolean.intercom_transcripts
          message: "typed \"{{ censored.text }}\""
      - action: script.turn_on
        target:
          entity_id: script.intercom_broadcast
        data:
          variables:
            message: "{{ censored.text }}"
            sender: "{{ sender }}"
            exclude_phone: "{{ own_phones }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.intercom_compose
        data:
          value: ""

automation:
  - id: voice_intercom_broadcast_by_voice
    alias: "Intercom: broadcast by voice"
    description: >-
      Anything said after the wake word or a single button press is announced
      verbatim on every other satellite and pushed to the intercom phones.
    mode: parallel
    triggers:
      - trigger: conversation
        command:
          - "{message}"
    actions:
      # Empty response first, so even a dropped echo stays silent.
      - set_conversation_response: ""
      - action: script.intercom_censor
        data:
          text: "{{ trigger.slots.message }}"
        response_variable: censored
      - variables:
          # Echo: the same text as the last broadcast, within 20 s, from a
          # different device. Happens when a shout starts both devices listening
          # in the same room, or when one device's playback triggers the other.
          echo: >-
            {% set clean = '[^a-z0-9 ]' %}
            {% set msg = censored.text | lower | regex_replace(clean, '') | trim %}
            {% set last = states('input_text.intercom_last_message') | lower | regex_replace(clean, '') | trim %}
            {% set age = (now() - states.input_text.intercom_last_message.last_changed).total_seconds() %}
            {% set same_sender = (trigger.satellite_id or '') == states('input_text.intercom_last_sender') %}
            {{ msg == last and age < 20 and not same_sender }}
          # Not from a satellite: Assist in the Companion app or the web UI.
          device_name: >-
            {{ (device_attr(trigger.device_id, 'name_by_user') or device_attr(trigger.device_id, 'name'))
               if trigger.device_id else '' }}
          source_name: >-
            {% if trigger.satellite_id %}{{ area_name(trigger.satellite_id) or state_attr(trigger.satellite_id, 'friendly_name') }}
            {%- else %}{{ device_name or 'Assist' }}{% endif %}
          from_phone: >-
            {{ 'mobile_app_' ~ (device_name | slugify) if (not trigger.satellite_id and device_name) else '' }}
      # Every transcript goes to the logbook (shown on the Intercom dashboard).
      - action: logbook.log
        data:
          name: "{{ source_name }}"
          entity_id: input_boolean.intercom_transcripts
          message: "heard \"{{ censored.text }}\"{{ ' (echo, not sent)' if echo else '' }}"
      - condition: template
        alias: Drop an echo
        value_template: "{{ not echo }}"
      - action: script.turn_on
        target:
          entity_id: script.intercom_broadcast
        data:
          variables:
            message: "{{ censored.text }}"
            source: "{{ trigger.satellite_id or '' }}"
            sender: "{{ source_name }}"
            exclude_phone: "{{ from_phone }}"

  - id: voice_intercom_send_typed_on_commit
    alias: "Intercom: send typed message when the box is committed"
    description: >-
      The Message box commits when you press Return or the keyboard closes,
      which is what the first tap on Send does on a phone. Sending on commit
      makes that first tap work. The Send script is queued and clears the box,
      so a Send tap arriving as well does not send twice.
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_text.intercom_compose
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state | trim not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - action: script.intercom_send_typed
        data:
          user_id: "{{ trigger.to_state.context.user_id }}"

  - id: voice_intercom_phone_actions
    alias: "Intercom: phone notification actions"
    description: >-
      Reply button: the typed text is announced on every satellite and pushed to
      the other phones. Mute button (administrators' phones only, and only
      honoured from an administrator's account): shout-to-talk off on every
      device for 30 minutes (tapping again restarts the 30 minutes).
    mode: parallel
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: INTERCOM_REPLY
        id: reply
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: INTERCOM_MUTE_SHOUT
        id: mute
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.intercom_shout_mute
        id: unmute
    actions:
      - variables:
          phone: >-
            {% set d = trigger.event.data %}
            {{ (d.get('action_data') or {}).get('phone') or d.get('intercom_phone') or '' }}
          phone_name: >-
            {{ (phone | replace('mobile_app_', '') | replace('_', ' ') | title) if phone else 'Phone' }}
          shout_switches: >-
            {{ states.switch | map(attribute='entity_id') | select('search', '_shout_to_talk$') | list }}
          by_admin: >-
            {{ (trigger.event.context.user_id or '') in states('input_text.intercom_admins').split(',') | map('trim') | list }}
      - choose:
          - conditions:
              - condition: trigger
                id: reply
              - condition: template
                value_template: "{{ (trigger.event.data.get('reply_text') or '') | trim | length > 0 }}"
            sequence:
              - action: script.intercom_censor
                data:
                  text: "{{ trigger.event.data.reply_text | trim }}"
                response_variable: censored
              - action: logbook.log
                data:
                  name: "{{ phone_name }}"
                  entity_id: input_boolean.intercom_transcripts
                  message: "typed \"{{ censored.text }}\""
              - action: script.turn_on
                target:
                  entity_id: script.intercom_broadcast
                data:
                  variables:
                    message: "{{ censored.text }}"
                    sender: "{{ phone_name }}"
                    exclude_phone: "{{ phone }}"
          - conditions:
              - condition: trigger
                id: mute
              - condition: template
                alias: Only administrators can mute
                value_template: "{{ by_admin and shout_switches | count > 0 }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: "{{ shout_switches }}"
              - action: timer.start
                target:
                  entity_id: timer.intercom_shout_mute
                data:
                  duration: "00:30:00"
              - action: logbook.log
                data:
                  name: "{{ phone_name }}"
                  entity_id: input_boolean.intercom_transcripts
                  message: muted shout-to-talk for 30 minutes
          - conditions:
              - condition: trigger
                id: unmute
              - condition: template
                value_template: "{{ shout_switches | count > 0 }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: "{{ shout_switches }}"
