# Assist pipelines used by the intercom (Settings > Voice assistants).
# One per voice; a device speaks announcements with its own pipeline's voice.
# stt.faster_whisper is the Wyoming entity of the Whisper add-on (running Parakeet).
- name: Intercom
  language: en
  conversation_engine: conversation.home_assistant
  conversation_language: en
  stt_engine: stt.faster_whisper
  stt_language: en
  tts_engine: tts.piper
  tts_language: en_US
  tts_voice: en_US-libritts-high
  wake_word_entity: null
  wake_word_id: null
- name: Intercom (male voice)
  language: en
  conversation_engine: conversation.home_assistant
  conversation_language: en
  stt_engine: stt.faster_whisper
  stt_language: en
  tts_engine: tts.piper
  tts_language: en_US
  tts_voice: en_US-hfc_male-medium
  wake_word_entity: null
  wake_word_id: null
